<div class="container mt-4">
    <ul class="list-group">
        <li class="list-group-item">
            <strong>Nombre:</strong> {{ tienda.nombre }}
        </li>
        <li class="list-group-item">
            <strong>Direccion:</strong> {{ tienda.direccion }} 
        </li>
        <li class="list-group-item">
            <strong>Telefono:</strong> {{ tienda.telefono }}
        </li>
        {% load bootstrap_icons %}
        <div class="row btn-group">
            <div class="mb-2">
                <button type="button" 
                        class="btn btn-outline-primary"> 
                        <a href="{% url 'editar_tienda' tienda.id %}" ><span>{% bs_icon 'pencil' %}</span></a>
                </button>
            </div>
            <div class="mb-2">
                <form action = "{% url 'tienda_eliminar' tienda.id %}" onclick="return eliminar();" method = "post"> 
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">
                        <span>{% bs_icon 'trash' %}</span>
                    </button> 
                </form>
            </div>
        </div>
    </ul>
</div>
